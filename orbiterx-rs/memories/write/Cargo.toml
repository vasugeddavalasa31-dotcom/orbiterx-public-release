[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-memories-write"
version.workspace = true

[lib]
name = "orbiterx_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
orbiterx-backend-client = { workspace = true }
orbiterx-core = { workspace = true }
orbiterx-config = { workspace = true }
orbiterx-features = { workspace = true }
orbiterx-git-utils = { workspace = true }
orbiterx-login = { workspace = true }
orbiterx-model-provider = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-rollout = { workspace = true }
orbiterx-rollout-trace = { workspace = true }
orbiterx-secrets = { workspace = true }
orbiterx-state = { workspace = true }
orbiterx-terminal-detection = { workspace = true }
orbiterx-utils-absolute-path = { workspace = true }
orbiterx-utils-output-truncation = { workspace = true }
orbiterx-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
orbiterx-model-provider-info = { workspace = true }
orbiterx-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
