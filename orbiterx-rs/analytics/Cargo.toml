[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-analytics"
version.workspace = true

[lib]
doctest = false
name = "orbiterx_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
orbiterx-app-server-protocol = { workspace = true }
orbiterx-git-utils = { workspace = true }
orbiterx-login = { workspace = true }
orbiterx-model-provider = { workspace = true }
orbiterx-plugin = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
orbiterx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
