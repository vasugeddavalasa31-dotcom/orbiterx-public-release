[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-mcp-extension"
version.workspace = true

[lib]
name = "orbiterx_mcp_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
orbiterx-core = { workspace = true }
orbiterx-core-plugins = { workspace = true }
orbiterx-config = { workspace = true }
orbiterx-connectors = { workspace = true }
orbiterx-connectors-extension = { workspace = true }
orbiterx-exec-server = { workspace = true }
orbiterx-extension-api = { workspace = true }
orbiterx-features = { workspace = true }
orbiterx-mcp = { workspace = true }
orbiterx-plugin = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-utils-absolute-path = { workspace = true }
orbiterx-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
orbiterx-login = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
