[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-skills-extension"
version.workspace = true

[lib]
name = "orbiterx_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
orbiterx-core-skills = { workspace = true }
orbiterx-exec-server = { workspace = true }
orbiterx-extension-api = { workspace = true }
orbiterx-mcp = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-tools = { workspace = true }
orbiterx-utils-path-uri = { workspace = true }
orbiterx-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
orbiterx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
