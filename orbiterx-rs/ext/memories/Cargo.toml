[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-memories-extension"
version.workspace = true

[lib]
name = "orbiterx_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
orbiterx-core = { workspace = true }
orbiterx-extension-api = { workspace = true }
orbiterx-features = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-tools = { workspace = true }
orbiterx-utils-absolute-path = { workspace = true }
orbiterx-utils-output-truncation = { workspace = true }
orbiterx-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
