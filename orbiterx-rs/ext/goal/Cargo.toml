[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-goal-extension"
version.workspace = true

[lib]
name = "orbiterx_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
orbiterx-analytics = { workspace = true }
orbiterx-core = { workspace = true }
orbiterx-extension-api = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-state = { workspace = true }
orbiterx-tools = { workspace = true }
orbiterx-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
