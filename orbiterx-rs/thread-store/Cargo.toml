[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-thread-store"
version.workspace = true

[lib]
name = "orbiterx_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
orbiterx-app-server-protocol = { workspace = true }
orbiterx-git-utils = { workspace = true }
orbiterx-install-context = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-rollout = { workspace = true }
orbiterx-state = { workspace = true }
orbiterx-utils-path = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
