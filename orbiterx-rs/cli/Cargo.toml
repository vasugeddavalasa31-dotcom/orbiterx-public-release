[package]
name = "orbiterx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "orbiterx"
path = "src/main.rs"

[lib]
name = "orbiterx_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
orbiterx-app-server = { workspace = true }
orbiterx-app-server-daemon = { workspace = true }
orbiterx-app-server-protocol = { workspace = true }
orbiterx-app-server-test-client = { workspace = true }
orbiterx-arg0 = { workspace = true }
orbiterx-api = { workspace = true }
orbiterx-chatgpt = { workspace = true }
orbiterx-cloud-tasks = { path = "../cloud-tasks" }
orbiterx-utils-cli = { workspace = true }
orbiterx-config = { workspace = true }
orbiterx-core = { workspace = true }
orbiterx-core-plugins = { workspace = true }
orbiterx-home = { workspace = true }
orbiterx-exec = { workspace = true }
orbiterx-exec-server = { workspace = true }
orbiterx-execpolicy = { workspace = true }
orbiterx-features = { workspace = true }
orbiterx-git-utils = { workspace = true }
orbiterx-install-context = { workspace = true }
orbiterx-login = { workspace = true }
orbiterx-memories-write = { workspace = true }
orbiterx-mcp = { workspace = true }
orbiterx-mcp-server = { workspace = true }
orbiterx-model-provider = { workspace = true }
orbiterx-models-manager = { workspace = true }
orbiterx-plugin = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-responses-api-proxy = { workspace = true }
orbiterx-rmcp-client = { workspace = true }
orbiterx-rollout = { workspace = true }
orbiterx-rollout-trace = { workspace = true }
orbiterx-sandboxing = { workspace = true }
orbiterx-state = { workspace = true }
orbiterx-stdio-to-uds = { workspace = true }
orbiterx-terminal-detection = { workspace = true }
orbiterx-tui = { workspace = true }
orbiterx-utils-absolute-path = { workspace = true }
orbiterx-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
orbiterx_windows_sandbox = { package = "orbiterx-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
orbiterx-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
