[package]
edition.workspace = true
license.workspace = true
name = "orbiterx-core"
version.workspace = true

[lib]
name = "orbiterx_core"
path = "src/lib.rs"

[[bin]]
name = "orbiterx-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
orbiterx-analytics = { workspace = true }
orbiterx-agent-graph-store = { workspace = true }
orbiterx-api = { workspace = true }
orbiterx-app-server-protocol = { workspace = true }
orbiterx-apply-patch = { workspace = true }
orbiterx-async-utils = { workspace = true }
orbiterx-code-mode = { workspace = true }
orbiterx-connectors = { workspace = true }
orbiterx-context-fragments = { workspace = true }
orbiterx-config = { workspace = true }
orbiterx-core-plugins = { workspace = true }
orbiterx-core-skills = { workspace = true }
orbiterx-exec-server = { workspace = true }
orbiterx-extension-api = { workspace = true }
orbiterx-extension-items = { workspace = true }
orbiterx-features = { workspace = true }
orbiterx-feedback = { workspace = true }
orbiterx-file-system = { workspace = true }
orbiterx-login = { workspace = true }
orbiterx-memories-read = { workspace = true }
orbiterx-mcp = { workspace = true }
orbiterx-model-provider-info = { workspace = true }
orbiterx-models-manager = { workspace = true }
orbiterx-shell-command = { workspace = true }
orbiterx-execpolicy = { workspace = true }
orbiterx-git-utils = { workspace = true }
orbiterx-hooks = { workspace = true }
orbiterx-http-client = { workspace = true }
orbiterx-install-context = { workspace = true }
orbiterx-network-proxy = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-plugin = { workspace = true }
orbiterx-model-provider = { workspace = true }
orbiterx-keyring-store = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-response-debug-context = { workspace = true }
orbiterx-prompts = { workspace = true }
orbiterx-rollout = { workspace = true }
orbiterx-rollout-trace = { workspace = true }
orbiterx-rmcp-client = { workspace = true }
orbiterx-sandboxing = { workspace = true }
orbiterx-state = { workspace = true }
orbiterx-terminal-detection = { workspace = true }
orbiterx-thread-store = { workspace = true }
orbiterx-tools = { workspace = true }
orbiterx-utils-absolute-path = { workspace = true }
orbiterx-utils-cache = { workspace = true }
orbiterx-utils-image = { workspace = true }
orbiterx-utils-home-dir = { workspace = true }
orbiterx-utils-output-truncation = { workspace = true }
orbiterx-utils-path = { workspace = true }
orbiterx-utils-path-uri = { workspace = true }
orbiterx-utils-plugins = { workspace = true }
orbiterx-utils-pty = { workspace = true }
orbiterx-utils-string = { workspace = true }
orbiterx-utils-stream-parser = { workspace = true }
orbiterx-windows-sandbox = { package = "orbiterx-windows-sandbox", path = "../windows-sandbox-rs" }
csv = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
orbiterx-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
orbiterx-image-generation-extension = { workspace = true }
orbiterx-home = { workspace = true }
orbiterx-otel = { workspace = true }
orbiterx-test-binary-support = { workspace = true }
orbiterx-utils-cargo-bin = { workspace = true }
orbiterx-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
