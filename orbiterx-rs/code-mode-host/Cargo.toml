[package]
name = "orbiterx-code-mode-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "orbiterx-code-mode-host"
path = "src/main.rs"

[lib]
doctest = false
name = "orbiterx_code_mode_host"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
orbiterx-code-mode = { workspace = true }
orbiterx-code-mode-protocol = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
orbiterx-protocol = { workspace = true }
orbiterx-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
