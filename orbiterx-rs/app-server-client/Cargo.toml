[package]
name = "orbiterx-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "orbiterx_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
orbiterx-app-server = { workspace = true }
orbiterx-app-server-protocol = { workspace = true }
orbiterx-arg0 = { workspace = true }
orbiterx-config = { workspace = true }
orbiterx-core = { workspace = true }
orbiterx-exec-server = { workspace = true }
orbiterx-feedback = { workspace = true }
orbiterx-protocol = { workspace = true }
orbiterx-uds = { workspace = true }
orbiterx-utils-absolute-path = { workspace = true }
orbiterx-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
