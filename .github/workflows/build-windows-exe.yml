# Build the OrbiterX Windows .exe (Tauri app: Next.js frontend + Rust
# orbiterx-app-server sidecar) and publish it to the public release repo:
#   vasugeddavalasa31-dotcom/orbiterx-public-release
#
# Mirrors the LOCAL build (build.sh → `pnpm tauri build` in frontend/):
#   1. `beforeBuildCommand` (`pnpm tauri:prepare-sidecars`) builds the
#      codeg-mcp + orbiterx-app-server sidecars for the target triple and
#      stages them into frontend/src-tauri/binaries/
#   2. `pnpm build` produces the Next.js static export (frontendDist: ../out)
#   3. `tauri build` compiles the app and bundles the Windows NSIS .exe
#   4. With TAURI_SIGNING_PRIVATE_KEY set, emits signed updater artifacts
#      (latest.json + .sig) so installed apps auto-update from this repo.
#
# Why it lives in the PUBLIC repo: GitHub-hosted Actions minutes are free and
# unlimited on public repos but metered on private ones. The source lives in
# the private repo vasugeddavalasa31-dotcom/orbiterxprodcution and is checked
# out here via a PAT.
#
# Trigger: manual (workflow_dispatch) with a version, or a pushed tag `v*.*.*`.
# Tag name must be the release version prefixed with `v`, e.g. `v1.2.39`.
#
# Required repository secrets (on THIS repo):
#   PRIVATE_SOURCE_TOKEN — a PAT with read access to
#       vasugeddavalasa31-dotcom/orbiterxprodcution (Contents: Read) and write
#       access to THIS repo (Contents: Read and write).
#   TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD — the Tauri
#       updater signing key. REQUIRED for auto-update: without it the build
#       skips latest.json/.sig (installers still publish, but installed apps
#       cannot verify an update). Generate with `tauri signer generate`.

name: Build Windows EXE & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.39 (leave blank to read tauri.conf.json)"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  # `GITHUB_TOKEN` creates the release in THIS repo (orbiterx-public-release).
  # The private-source checkout uses PRIVATE_SOURCE_TOKEN explicitly, so it is
  # unaffected by this scope.
  contents: write

env:
  SOURCE_REPO: vasugeddavalasa31-dotcom/orbiterxprodcution
  CARGO_TARGET_DIR: "${{ github.workspace }}/target"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=/DEBUG:NONE"

jobs:
  build-sidecars:
    name: Build ${{ matrix.sidecar.name }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sidecar:
          - name: "orbiterx-app-server"
            crate_path: "orbiterx-rs/app-server"
            bin_name: "orbiterx-app-server"
            dest_name: "orbiterx-app-server-x86_64-pc-windows-msvc.exe"
            cargo_flags: ""
          - name: "codeg-mcp"
            crate_path: "frontend/src-tauri"
            bin_name: "codeg-mcp"
            dest_name: "codeg-mcp-x86_64-pc-windows-msvc.exe"
            cargo_flags: "--no-default-features"
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-sidecar-${{ matrix.sidecar.name }}"
          cache-on-failure: true

      - name: Compile sidecar binary
        shell: powershell
        working-directory: ${{ matrix.sidecar.crate_path }}
        run: |
          $flags = "${{ matrix.sidecar.cargo_flags }}"
          if ($flags) {
            cargo build --release --bin ${{ matrix.sidecar.bin_name }} --target x86_64-pc-windows-msvc $flags.Split(' ')
          } else {
            cargo build --release --bin ${{ matrix.sidecar.bin_name }} --target x86_64-pc-windows-msvc
          }

      - name: Stage sidecar artifact
        shell: powershell
        run: |
          $binName = "${{ matrix.sidecar.bin_name }}.exe"
          $destName = "${{ matrix.sidecar.dest_name }}"
          $candidates = @(
            "target/x86_64-pc-windows-msvc/release/$binName",
            "target/release/$binName",
            "${{ matrix.sidecar.crate_path }}/target/x86_64-pc-windows-msvc/release/$binName",
            "${{ matrix.sidecar.crate_path }}/target/release/$binName"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $found = $c
              break
            }
          }
          if (-not $found) { throw "Could not find built binary for ${{ matrix.sidecar.bin_name }}" }
          New-Item -ItemType Directory -Force -Path "artifacts"
          Copy-Item -Path $found -Destination "artifacts/$destName" -Force
          Write-Host "Staged artifact: artifacts/$destName"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sidecar.name }}
          path: artifacts/${{ matrix.sidecar.dest_name }}
          retention-days: 1

  package-and-publish:
    name: Package Windows EXE & Publish
    needs: build-sidecars
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-tauri-main"
          cache-on-failure: true

      - name: Download orbiterx-app-server sidecar
        uses: actions/download-artifact@v4
        with:
          name: orbiterx-app-server
          path: frontend/src-tauri/binaries

      - name: Download codeg-mcp sidecar
        uses: actions/download-artifact@v4
        with:
          name: codeg-mcp
          path: frontend/src-tauri/binaries

      - name: Verify pre-staged sidecars
        shell: powershell
        run: |
          Get-ChildItem -Path frontend/src-tauri/binaries

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $conf = Get-Content -Raw frontend/src-tauri/tauri.conf.json | ConvertFrom-Json
            $v = [string]$conf.version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $v"

      - name: Install frontend dependencies
        working-directory: frontend
        shell: powershell
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri Windows app (Next.js export + NSIS exe)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: powershell
        run: |
          $cfg = @{
            version = $env:VERSION
            bundle = @{
              createUpdaterArtifacts = $true
              targets = @("nsis")
            }
          } | ConvertTo-Json -Depth 5
          $cfgPath = Join-Path $env:RUNNER_TEMP "tauri-build-config.json"
          $cfg | Set-Content -Path $cfgPath -Encoding UTF8
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "Signing key present — creating signed updater artifacts."
            pnpm tauri build --config $cfgPath
          } else {
            $cfgNoSig = @{
              version = $env:VERSION
              bundle = @{
                createUpdaterArtifacts = $false
                targets = @("nsis")
              }
            } | ConvertTo-Json -Depth 5
            $cfgNoSig | Set-Content -Path $cfgPath -Encoding UTF8
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY — building without updater signing."
            pnpm tauri build --config $cfgPath
          }

      - name: Generate latest.json updater manifest
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REPO: vasugeddavalasa31-dotcom/orbiterx-public-release
        run: |
          $v = $env:VERSION
          $bundle = "target/release/bundle"
          if (-not (Test-Path "$bundle/nsis")) {
            $bundle = "frontend/src-tauri/target/release/bundle"
          }
          $exe = Get-ChildItem "$bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer exe found under bundle/nsis" }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "Missing signature: $sigPath" }
          $sigB64 = (Get-Content $sigPath -Raw).Trim()
          $exeName = Split-Path $exe.FullName -Leaf
          $url = "https://github.com/$env:RELEASE_REPO/releases/download/v$v/$exeName"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = $v
            notes   = ""
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigB64
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifestPath = "$bundle/latest.json"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)
          Write-Host "Generated $manifestPath (UTF-8 without BOM)"
          Write-Host $manifest

      - name: Publish assets to this repo's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "${{ steps.version.outputs.version }}"
          body: "OrbiterX Windows build v${{ steps.version.outputs.version }}"
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/*.sig
            target/release/bundle/latest.json
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/*.sig
            frontend/src-tauri/target/release/bundle/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
