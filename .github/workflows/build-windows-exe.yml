# Build the OrbiterX Windows standalone .exe and publish it to THIS repo
# (orbiterx-public-release).
#
# WHY THIS LIVES IN THE PUBLIC REPO: GitHub-hosted Actions minutes are free
# and unlimited on public repos, but metered on private repos. Putting the
# build here means it never consumes the private repo's minutes.
#
# The source lives in the private repo vasugeddavalasa31-dotcom/orbiterxprodcution.
# This workflow checks it out using a PAT, builds the Rust `orbiterx` CLI +
# the Electron app (`orbiterx-standalone/`), then publishes the exe,
# .blockmap, and latest.yml as a release in this repo.
#
# Trigger: manual (workflow_dispatch) with a version, or a pushed tag `v*.*.*`
# on THIS repo. Tag name must be the version prefixed with `v`, e.g. `v1.2.39`.
#
# Required repository secret (on THIS repo):
#   PRIVATE_SOURCE_TOKEN — a PAT with:
#     - read access to vasugeddavalasa31-dotcom/orbiterxprodcution (Contents: Read)
#     - write access to THIS repo (Contents: Read and write)
#   A classic token with the `repo` scope satisfies both (the existing
#   PUBLIC_RELEASE_TOKEN value works if it is a classic `repo`-scoped token).

name: Build Windows EXE & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.39 (leave blank to read orbiterx-standalone/package.json)"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  SOURCE_REPO: vasugeddavalasa31-dotcom/orbiterxprodcution

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orbiterx-rs

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $pkg = Get-Content -Raw orbiterx-standalone/package.json | ConvertFrom-Json
            $v = [string]$pkg.version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $v"

      - name: Build orbiterx CLI (release)
        working-directory: orbiterx-rs
        run: cargo build -p orbiterx-cli --release

      - name: Stage orbiterx.exe for Electron packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force orbiterx-standalone/resources | Out-Null
          Copy-Item orbiterx-rs/target/release/orbiterx.exe orbiterx-standalone/resources/orbiterx.exe -Force
          Get-Item orbiterx-standalone/resources/orbiterx.exe | Select-Object Name, Length

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build renderer + package Windows EXE
        working-directory: orbiterx-standalone
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec electron-builder --win nsis --publish never `
            --config.extraMetadata.version="$env:VERSION"

      - name: List packaged artifacts
        shell: pwsh
        run: Get-ChildItem orbiterx-standalone/dist | Select-Object Name, Length

      - name: Publish assets to this repo's release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dist = "orbiterx-standalone/dist"
          $assets = @(
            "$dist/orbiterx-electron-win-x64.exe",
            "$dist/orbiterx-electron-win-x64.exe.blockmap",
            "$dist/latest.yml"
          )
          foreach ($a in $assets) {
            if (-not (Test-Path $a)) { throw "Missing artifact: $a" }
          }
          if (gh release view "v$v" -R ${{ github.repository }} --json tagName --jq .tagName 2>$null) {
            Write-Host "Release v$v already exists — uploading assets (clobber)."
            gh release upload "v$v" $assets -R ${{ github.repository }} --clobber
          } else {
            Write-Host "Creating release v$v."
            gh release create "v$v" $assets -R ${{ github.repository }} --title "$v" --notes "OrbiterX Windows build v$v"
          }
          Write-Host "Published: https://github.com/${{ github.repository }}/releases/tag/v$v"
