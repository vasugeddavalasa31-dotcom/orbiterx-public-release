# Build the OrbiterX Windows .exe (Tauri app: Next.js frontend + Rust
# orbiterx-app-server sidecar) and publish it to the public release repo:
#   vasugeddavalasa31-dotcom/orbiterx-public-release
#
# Mirrors the LOCAL build (build.sh → `pnpm tauri build` in frontend/):
#   1. `beforeBuildCommand` (`pnpm tauri:prepare-sidecars`) builds the
#      codeg-mcp + orbiterx-app-server sidecars for the target triple and
#      stages them into frontend/src-tauri/binaries/
#   2. `pnpm build` produces the Next.js static export (frontendDist: ../out)
#   3. `tauri build` compiles the app and bundles the Windows NSIS .exe
#   4. With TAURI_SIGNING_PRIVATE_KEY set, emits signed updater artifacts
#      (latest.json + .sig) so installed apps auto-update from this repo.
#
# Why it lives in the PUBLIC repo: GitHub-hosted Actions minutes are free and
# unlimited on public repos but metered on private ones. The source lives in
# the private repo vasugeddavalasa31-dotcom/orbiterxprodcution and is checked
# out here via a PAT.
#
# Trigger: manual (workflow_dispatch) with a version, or a pushed tag `v*.*.*`.
# Tag name must be the release version prefixed with `v`, e.g. `v1.2.39`.
#
# Required repository secrets (on THIS repo):
#   PRIVATE_SOURCE_TOKEN — a PAT with read access to
#       vasugeddavalasa31-dotcom/orbiterxprodcution (Contents: Read) and write
#       access to THIS repo (Contents: Read and write).
#   TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD — the Tauri
#       updater signing key. REQUIRED for auto-update: without it the build
#       skips latest.json/.sig (installers still publish, but installed apps
#       cannot verify an update). Generate with `tauri signer generate`.

name: Build Windows EXE & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.39 (leave blank to read tauri.conf.json)"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  SOURCE_REPO: vasugeddavalasa31-dotcom/orbiterxprodcution

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri, orbiterx-rs

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $conf = Get-Content -Raw frontend/src-tauri/tauri.conf.json | ConvertFrom-Json
            $v = [string]$conf.version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $v"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Tauri Windows app (sidecars + Next.js export + NSIS exe)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $v = $env:VERSION
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "Signing key present — creating signed updater artifacts."
            pnpm tauri build --config "{`"version`":`"$v`",`"bundle`":{`"createUpdaterArtifacts`":true}}"
          } else {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY — building without updater signing (latest.json will not be produced)."
            pnpm tauri build --config "{`"version`":`"$v`",`"bundle`":{`"createUpdaterArtifacts`":false}}"
          }

      - name: List bundle artifacts
        shell: pwsh
        run: |
          Get-ChildItem frontend/src-tauri/target/release/bundle/nsis | Select-Object Name, Length
          Write-Host "--- updater artifacts (if any) ---"
          Get-ChildItem frontend/src-tauri/target/release/bundle/nsis -Filter "*.sig" | Select-Object Name, Length
          Get-ChildItem frontend/src-tauri/target/release/bundle/nsis -Filter "latest.json" | Select-Object Name, Length

      - name: Publish assets to this repo's release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $nsis = "frontend/src-tauri/target/release/bundle/nsis"
          $assets = @()
          Get-ChildItem $nsis -Filter "*.exe" | ForEach-Object { $assets += $_.FullName }
          Get-ChildItem $nsis -Filter "*.sig" | ForEach-Object { $assets += $_.FullName }
          if (Test-Path "$nsis/latest.json") { $assets += "$nsis/latest.json" }
          if ($assets.Count -eq 0) { throw "No installer found in $nsis" }
          foreach ($a in $assets) { Write-Host "Asset: $a" }
          if (gh release view "v$v" -R ${{ github.repository }} --json tagName --jq .tagName 2>$null) {
            Write-Host "Release v$v already exists — uploading assets (clobber)."
            gh release upload "v$v" $assets -R ${{ github.repository }} --clobber
          } else {
            Write-Host "Creating release v$v."
            gh release create "v$v" $assets -R ${{ github.repository }} --title "$v" --notes "OrbiterX Windows build v$v"
          }
          Write-Host "Published: https://github.com/${{ github.repository }}/releases/tag/v$v"
